<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>relay-pubsub hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Build: ./docs/social/build-hero-dark.sh  ->  relay-pubsub-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --violet:#bf5af2;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  .aurora { position:absolute; inset:0;
    background:radial-gradient(720px 460px at 80% 16%, rgba(41,151,255,.34), transparent 62%),
               radial-gradient(600px 420px at 104% 98%, rgba(100,210,255,.16), transparent 60%),
               radial-gradient(520px 380px at 6% 110%, rgba(0,113,227,.28), transparent 60%); }
  .copy { position:absolute; left:60px; top:52px; width:560px; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:80px; line-height:.95; font-weight:800; letter-spacing:-.05em; white-space:nowrap;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:6px; }
  .tag { margin:14px 0 0; font-size:31px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:520px; text-shadow:0 1px 12px #000; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:3; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  .art { position:absolute; left:520px; top:0; width:680px; height:630px; z-index:2; }
  .art svg { display:block; }
  #labels { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; font-family:var(--mono); font-size:12.5px; color:#a1a1a6; text-align:center; transform:translate(-50%,-50%); white-space:nowrap; }
  .lbl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#e5e5ea; }
  .lbl span { display:block; margin-top:3px; }
  .lbl.box { padding:7px 12px; border-radius:12px; background:rgba(8,10,14,.85); border:1px solid rgba(255,255,255,.14); }
  .lbl.chip { padding:6px 11px; border-radius:13px; font-size:12.5px; font-weight:700; color:#cfe6ff; background:rgba(10,20,35,.85); border:1px solid rgba(41,151,255,.5); box-shadow:0 0 16px rgba(41,151,255,.2); }
  .lbl.left { transform:translate(0,-50%); text-align:left; }
  .lbl.right { transform:translate(-100%,-50%); text-align:right; }
  .ok { color:var(--green) !important; } .warn { color:var(--amber) !important; } .bad { color:var(--red) !important; } .sig { color:var(--signal) !important; } .cy { color:var(--cyan) !important; } .vi { color:var(--violet) !important; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="art"><svg id="art" width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="labels"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>Pub/Sub compatibility gateway</span></div>
  <div class="word">relay-pubsub</div>
  <div class="tag">Speak Google Pub/Sub.<br><em>Land in Zyvor Relay.</em></div>
  <div class="lede">Gateway that serves Google Pub/Sub gRPC and REST and forwards each publish to Relay&#x27;s POST /v1/events API.</div>
  <div class="stats"><div class="stat"><b>35</b><span>gRPC methods</span></div><div class="stat"><b>3</b><span>gRPC services</span></div><div class="stat"><b>4</b><span>backends</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/relay-pubsub</span><span>Apache-2.0</span></div>
<script>
var Z = (function () {
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art'), labels = document.getElementById('labels');
  var seed = 20261004;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function el(tag, a, parent) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); (parent || svg).appendChild(n); return n; }
  function g(attrs) { return el('g', attrs || {}); }
  function label(x, y, inner, cls, style) { var d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.style.left = (520 + x) + 'px'; d.style.top = y + 'px'; if (style) d.setAttribute('style', d.getAttribute('style') + ';' + style); d.innerHTML = inner; labels.appendChild(d); return d; }
  return { NS: NS, svg: svg, W: 680, H: 630, rnd: rnd, el: el, g: g, label: label,
    reseed: function (s) { seed = s; },
    c: { blue: '#0071e3', signal: '#2997ff', cyan: '#64d2ff', green: '#30d158', amber: '#ff9f0a', red: '#ff453a', violet: '#bf5af2', teal: '#40c8e0', indigo: '#5e5ce6', pink: '#ff375f', white: '#f5f5f7', grey: '#8e8e93' } };
})();
(function () {
// relay-pubsub: bow-tie of lines. Many Pub/Sub publishers converge through the gateway knot and leave as ordered event lanes into Relay.
var C = Z.c, kx = 352, ky = 300;
var defs = Z.el('defs', {});
defs.innerHTML = '<filter id="rp-gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
  '<filter id="rp-sf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>' +
  '<linearGradient id="rp-in" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="' + kx + '" y2="0"><stop offset="0" stop-color="#5e5ce6" stop-opacity=".25"/><stop offset=".6" stop-color="#2997ff" stop-opacity=".55"/><stop offset="1" stop-color="#64d2ff" stop-opacity="1"/></linearGradient>' +
  '<linearGradient id="rp-out" gradientUnits="userSpaceOnUse" x1="' + kx + '" y1="0" x2="600" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset=".35" stop-color="#64d2ff" stop-opacity=".8"/><stop offset="1" stop-color="#2997ff" stop-opacity=".55"/></linearGradient>' +
  '<radialGradient id="rp-halo"><stop offset="0" stop-color="#64d2ff" stop-opacity=".7"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>' +
  '<linearGradient id="rp-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2997ff" stop-opacity="0"/><stop offset=".2" stop-color="#64d2ff"/><stop offset=".8" stop-color="#64d2ff"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></linearGradient>';

var hues = [C.signal, C.cyan, C.indigo, C.teal, C.blue, C.violet];
Z.el('ellipse', { cx: kx, cy: ky, rx: 150, ry: 120, fill: 'url(#rp-halo)', opacity: .35 });

// inbound: many publishers on a loose arc, converging to the knot
var NI = 26, inPaths = [];
for (var i = 0; i < NI; i++) {
  var t = i / (NI - 1), y = 72 + t * 506 + (Z.rnd() - .5) * 10;
  var x = 116 + 46 * Math.pow(Math.abs(t - .5) * 2, 1.6) + Z.rnd() * 14;
  var d = 'M' + x.toFixed(1) + ',' + y.toFixed(1) + ' C' + (x + 140).toFixed(1) + ',' + y.toFixed(1) + ' ' + (kx - 110) + ',' + (ky + (y - ky) * .06).toFixed(1) + ' ' + kx + ',' + ky;
  var p = Z.el('path', { d: d, fill: 'none', stroke: 'url(#rp-in)', 'stroke-width': 1.1 });
  inPaths.push(p);
  var h = hues[Math.floor(Z.rnd() * hues.length)];
  Z.el('circle', { cx: x, cy: y, r: 6, fill: h, opacity: .14 });
  Z.el('circle', { cx: x, cy: y, r: 2.6, fill: h, opacity: .9 });
}

// outbound: ordered lanes fanning to Relay
var NO = 13, bx = 598, outPaths = [];
for (var j = 0; j < NO; j++) {
  var y2 = 128 + j * (344 / (NO - 1));
  var d2 = 'M' + kx + ',' + ky + ' C' + (kx + 110) + ',' + (ky + (y2 - ky) * .06).toFixed(1) + ' ' + (bx - 120) + ',' + y2.toFixed(1) + ' ' + (bx - 6) + ',' + y2.toFixed(1);
  outPaths.push(Z.el('path', { d: d2, fill: 'none', stroke: 'url(#rp-out)', 'stroke-width': 1.4 }));
  Z.el('circle', { cx: bx - 6, cy: y2, r: 2.2, fill: '#fff', opacity: .9 });
}

// message pulses
[2, 7, 11, 15, 19, 23].forEach(function (k, n) {
  var p = inPaths[k], L = p.getTotalLength(), pt = p.getPointAtLength(L * (0.35 + 0.1 * (n % 3)));
  Z.el('circle', { cx: pt.x, cy: pt.y, r: 3, fill: '#fff', filter: 'url(#rp-gl)' });
});
[1, 4, 8, 11].forEach(function (k, n) {
  var p = outPaths[k], L = p.getTotalLength(), pt = p.getPointAtLength(L * (0.55 + 0.12 * (n % 2)));
  var g = Z.g({ transform: 'translate(' + pt.x.toFixed(1) + ',' + pt.y.toFixed(1) + ')', filter: 'url(#rp-gl)' });
  Z.el('rect', { x: -7, y: -4, width: 14, height: 8, rx: 2, fill: 'rgba(8,14,26,.95)', stroke: C.cyan, 'stroke-width': 1.2 }, g);
});

// Relay intake bar
Z.el('rect', { x: bx - 2, y: 96, width: 4, height: 408, rx: 2, fill: 'url(#rp-bar)', filter: 'url(#rp-gl)' });
Z.el('rect', { x: bx - 12, y: 96, width: 24, height: 408, fill: 'url(#rp-bar)', opacity: .12, filter: 'url(#rp-sf)' });

// knot: the gateway
Z.el('circle', { cx: kx, cy: ky, r: 40, fill: C.cyan, opacity: .25, filter: 'url(#rp-sf)' });
Z.el('circle', { cx: kx, cy: ky, r: 22, fill: 'rgba(6,10,18,.92)', stroke: C.cyan, 'stroke-width': 2, filter: 'url(#rp-gl)' });
Z.el('circle', { cx: kx, cy: ky, r: 30, fill: 'none', stroke: 'rgba(100,210,255,.35)', 'stroke-dasharray': '2 4' });
Z.el('circle', { cx: kx, cy: ky, r: 6, fill: '#fff', filter: 'url(#rp-gl)' });

Z.label(kx, ky + 62, '<b>relay-pubsub</b><span>topic = event type</span>');
Z.label(206, 40, 'Publish &middot; gRPC &middot; REST', 'chip');
Z.label(bx - 4, 64, '<b>Relay</b>');
Z.label(bx - 46, 548, 'POST /v1/events', 'chip');
})();
</script>
</body>
</html>
