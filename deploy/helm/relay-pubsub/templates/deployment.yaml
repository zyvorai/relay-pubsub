apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: http, containerPort: 8080 }
          env:
            - { name: RELAY_BACKEND, value: {{ .Values.relay.backend | quote }} }
            - { name: RELAY_BASE_URL, value: {{ .Values.relay.baseUrl | quote }} }
            {{- if eq .Values.relay.backend "http" }}
            - name: RELAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.relay.existingSecret }}, key: {{ .Values.relay.tokenKey }} }
            {{- end }}
            {{- if .Values.gatewayAuth.enabled }}
            - name: RELAY_PUBSUB_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.gatewayAuth.existingSecret }}, key: {{ .Values.gatewayAuth.tokenKey }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: http, scheme: HTTPS }
          resources: {{- toYaml .Values.resources | nindent 12 }}
