{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-console
  labels:
    app.kubernetes.io/name: relay-pubsub-console
spec:
  type: {{ .Values.console.service.type }}
  selector: { app: {{ .Release.Name }}-console }
  ports:
    - { name: https, port: {{ .Values.console.service.port }}, targetPort: https }
{{- end }}
