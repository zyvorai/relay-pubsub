replicaCount: 1
image:
  repository: ghcr.io/zyvorai/relay-pubsub
  tag: "0.4.0"
  pullPolicy: IfNotPresent

tls:
  certPath: /var/lib/relay-pubsub/tls/cert.pem
  keyPath: /var/lib/relay-pubsub/tls/key.pem
  san: "localhost,relay-pubsub,relay-pubsub.relay-pubsub.svc,relay-pubsub.relay-pubsub.svc.cluster.local"

persist:
  enabled: "1"
  dataDir: /var/lib/relay-pubsub/data
  # Auto-create a ReadWriteOnce PVC (single-replica restart durability).
  createPvc: true
  size: 2Gi
  storageClass: ""
  # Or point at an existing claim (takes precedence over createPvc).
  persistentVolumeClaim: ""

push:
  intervalSeconds: "2"

relay:
  backend: relay-events
  baseUrl: https://REPLACE_HOST:8443
  tlsInsecure: "1"
  gcpProject: fasal-onprem
  actionsTopic: farm-actions
  actionsSubscription: farm-actions-sub
  existingSecret: relay-pubsub-secrets
  tokenKey: relay-auth-token

gatewayAuth:
  enabled: false
  existingSecret: relay-pubsub-secrets
  tokenKey: gateway-token

service:
  type: ClusterIP
  grpcPort: 50051
  httpPort: 8080

console:
  enabled: true
  image:
    repository: ghcr.io/zyvorai/relay-pubsub-console
    tag: "0.4.0"
    pullPolicy: IfNotPresent
  port: 8082
  tlsSan: "localhost,relay-pubsub-console"
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "2", memory: 1Gi }
